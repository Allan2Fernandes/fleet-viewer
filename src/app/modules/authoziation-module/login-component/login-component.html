<div class="min-h-screen flex items-center justify-center bg-stone-200">

  <form [formGroup]="form" class="w-72">

    <h1 class="text-3xl font-serif mb-6">
      Welcome Back
    </h1>

    <div class="mb-4">
      <label for="email" class="text-sm">
        Email
      </label>

      <input
        id="email"
        type="email"
        formControlName="email"
        required
        autocomplete="email"
        class="w-full mt-1 px-3 py-2 border border-stone-400 rounded"
      />
    </div>

    <div class="mb-6">
      <label for="password" class="text-sm">
        Password
      </label>

      <input
        id="password"
        type="password"
        formControlName="password"
        required
        autocomplete="current-password"
        class="w-full mt-1 px-3 py-2 border border-stone-400 rounded"
      />
    </div>

    <button
      type="button"
      (click)="login()"
      [disabled]="!form.valid"
      class="w-full py-2 bg-gray-900 text-white rounded disabled:opacity-50"
    >
      Sign In
    </button>

  </form>

</div>
