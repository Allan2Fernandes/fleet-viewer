<app-nav-bar></app-nav-bar>
<div class="flex flex-row justify-center gap-6 py-10">

  <!-- Robot list -->
  <div class="w-64 h-[560px] border rounded-lg bg-white p-4 flex flex-col">

    <div class="mb-4 shrink-0">
      <div class="flex justify-between items-center mb-2">
        <span class="text-sm font-medium">
          Polling interval
        </span>

        <span class="text-sm text-gray-500">
          {{ ((pollingInterval$ | async) ?? 0) / 1000 }}s
        </span>
      </div>

      <input
        type="range"
        min="2000"
        max="10000"
        step="1000"
        [value]="pollingInterval$ | async"
        (input)="changePollingInterval($event)"
        class="w-full"
      />
    </div>

  <h2 class="font-semibold text-lg mb-4 shrink-0">
    Robots
  </h2>

  

  <div class="flex flex-col gap-2 overflow-y-auto min-h-0">

    @for (robot of listOfRobots$ | async; track robot.id) {
      <label class="flex items-center gap-3 p-2 rounded hover:bg-gray-100 cursor-pointer">

        <input
          type="checkbox"
          [checked]="selectedRobotIds.has(robot.id)"
          (change)="toggleRobot(robot.id)"
        />

        <div class="flex flex-col">
          <span class="font-medium">
            {{ robot.id }}
          </span>

          <span class="text-sm text-gray-500">
            {{ robot.type }}
          </span>
        </div>

      </label>
    }

  </div>

</div>


  <!-- Canvas -->
  <div class="border rounded-lg overflow-hidden bg-white w-fit">
    <canvas
      #robotCanvas
      width="900"
      height="560"
    ></canvas>
  </div>

</div>
