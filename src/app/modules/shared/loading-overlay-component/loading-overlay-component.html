@if (loading()) {
  <div
    class="fixed inset-0 z-[9999] flex items-center justify-center bg-black/30 backdrop-blur-sm"
  >
    <div class="flex flex-col items-center gap-3 rounded-lg bg-white px-8 py-6 shadow-xl">
      
      <div
        class="h-10 w-10 animate-spin rounded-full border-4 border-gray-200 border-t-blue-600"
      ></div>

      <span class="text-sm font-medium text-gray-700">
        Loading...
      </span>

    </div>
  </div>
}
