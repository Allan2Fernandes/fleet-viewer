<button
    class="{{buttonStyleMerged()}}"
    (click)="clicked.emit()"
    [disabled]="disabled()"
>
    <div class="{{contentStyleMerged()}}">
        @if(iconPath()) {
            <img src="{{iconPath()}}" class="{{imageStyleMerged()}}" alt="Logo"/>
        }
        {{text()}}
    </div>
</button>
