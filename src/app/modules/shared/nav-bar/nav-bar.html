<div class="h-16 w-full flex items-center justify-between px-6 md:px-16 bg-stone-100 border-b border-stone-800">
  <div
    class="h-full flex items-center justify-start cursor-pointer gap-3 group"
    (click)="navigateByUrl('/store')"
  >
    <span class="text-base tracking-wide text-stone-600 group-hover:text-stone-500 transition-colors">
      {{'TITLE' | translate}}
    </span>
  </div>

  <div class="flex-none flex items-center justify-end gap-3">
    <app-button
      [text]="'FLEET_VIEWER' | translate"
      [buttonStyle]="'flex items-center justify-center font-medium rounded-lg hover:bg-amber-700 bg-gray-900 h-10'"
      [contentStyle]="'flex items-center justify-center px-4 text-stone-200 font-serif'"
      (clicked)="fleetViewerClicked()"
    />
    <app-button
      [text]="'EVENT_GENERATOR' | translate"
      [buttonStyle]="'flex items-center justify-center font-medium rounded-lg hover:bg-amber-700 bg-gray-900 h-10'"
      [contentStyle]="'flex items-center justify-center px-4 text-stone-200 font-serif'"
      (clicked)="eventsClicked()"
    />
    <app-button
      [text]="'LOGOUT' | translate"
      [buttonStyle]="'flex items-center justify-center font-medium rounded-lg hover:bg-amber-700 bg-gray-900 h-10'"
      [contentStyle]="'flex items-center justify-center px-4 text-stone-200 font-serif'"
      (clicked)="logout()"
    />
  </div>
</div>
