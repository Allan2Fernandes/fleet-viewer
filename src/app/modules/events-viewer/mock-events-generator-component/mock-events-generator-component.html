<app-loading-overlay-component [loading]="loading()" />
<app-nav-bar></app-nav-bar>

<div class="h-screen w-full flex flex-col gap-6 justify-center items-center">

    <form [formGroup]="form" class="w-72 flex flex-col gap-2">
        <label
            for="size"
            class="text-sm font-medium text-stone-700"
        >
            Fleet Size
        </label>

        <input
            id="size"
            type="number"
            min="1"
            formControlName="fleet_size"
            required
            class="w-full h-10 px-3 border border-stone-400 rounded-lg
                   bg-white text-stone-800
                   focus:outline-none focus:ring-2 focus:ring-amber-600
                   focus:border-amber-600"
            placeholder="Number of robots"
        />
    </form>

    <app-button
        [text]="'Generate new mock data'"
        (clicked)="generateMockData()"
        [buttonStyle]="'flex items-center justify-center font-medium rounded-lg hover:bg-amber-700 bg-gray-900 h-10'"
        [contentStyle]="'flex items-center justify-center px-4 text-stone-200 font-serif gap-2'"
    />

</div>
